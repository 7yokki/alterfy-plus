name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q
      - run: python -m py_compile main.py data_manager.py platform_tools.py audio_engine.py offline.py artist_profiles.py recommendations.py lyrics.py
